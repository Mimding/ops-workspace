---
# Ansible 主机清单 (直接使用 ~/.ssh/config 中定义的 Host 别名)
all:
  children:
    gateway:
      hosts:
        node-b:
          server_role: "Nginx 网关入口"

    app_servers:
      hosts:
        node-c:
          server_role: "业务应用节点 1"
        node-d:
          server_role: "业务应用节点 2"

    databases:
      hosts:
        node-e:
          server_role: "核心数据库节点 (高危保护)"

    workers:
      hosts:
        node-f:
          server_role: "异步任务与备份节点"
