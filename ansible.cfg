[defaults]
inventory = ./inventory/hosts.yml
timeout = 15
forks = 10
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# 开启操作审计日志：记录 Agent 执行过的所有 Playbook 结果
log_path = ./ansible.log

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ControlPath=~/.ssh/sockets/%C -o StrictHostKeyChecking=accept-new -o ForwardAgent=no
